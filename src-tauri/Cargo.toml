[package]
name = "orlablocks"
version = "0.0.18"
description = "Orlablocks Control Panel"
authors = ["Orlando Almario"]
license = "MIT"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri-plugin-log = "2"
rfd = "0.15"
open = "5.3"
dirs = "5.0"
